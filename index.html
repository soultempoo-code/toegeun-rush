<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="17시 59분, 말 거는 동료들을 피해 6시 정각에 퇴근하세요.">
<meta property="og:title" content="퇴근 러시">
<meta property="og:description" content="잠깐맨, 라떼 부장, 아 맞다 팀장을 피해 6시 정각에 퇴근하세요.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#141a2e">
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>퇴근 러시</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one portrait stage. The canvas world fills it edge to edge; the clock, cards and buttons float above it. */
:root{
  --ink:#141a2e;        /* 퇴근 무렵 사무실의 남색 */
  --ink-2:#1f2742;
  --paper:#f6f1e7;
  --muted:#aab2cc;
  --exit:#19c37d;       /* 비상구 유도등 초록 */
  --exit-deep:#0c8f58;
  --dusk:#ff8a4c;       /* 6시 노을 */
  --alarm:#ff5a5f;
  --gold:#f4c95d;
  --font-display:'Black Han Sans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-body);font-size:15px;line-height:1.5;word-break:keep-all;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;background:var(--ink-2)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.hud{position:absolute;inset:0 0 auto 0;display:grid;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.hud-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tag{justify-self:start;font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--ink);color:var(--paper)}
.clock{font-family:var(--font-display);font-size:clamp(36px,11vw,48px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--paper);text-shadow:0 3px 0 var(--ink)}
.clock small{font-size:.42em;color:var(--paper);opacity:.75}
.clock.late{color:var(--gold)}
.clock.danger{color:var(--alarm)}
.hud-btns{justify-self:end;display:flex;gap:6px;pointer-events:auto}
.ic{width:38px;height:38px;border-radius:12px;border:0;background:var(--ink);color:var(--paper);font-weight:700;font-size:15px;cursor:pointer}
.prog{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--exit);border-radius:99px}
.prog .out{color:var(--exit)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--exit);color:var(--ink)}
.chip.bad{background:var(--alarm);color:var(--paper)}
.chip.gold{background:var(--gold)}

.ban{position:absolute;left:50%;top:27%;transform:translateX(-50%) rotate(-2deg);width:min(88%,380px);padding:14px 16px 12px;border-radius:18px;background:var(--paper);color:var(--ink);text-align:center;box-shadow:0 8px 0 var(--ink);pointer-events:none;animation:pop .18s ease-out}
.ban .who{font-size:13px;font-weight:700;color:var(--exit-deep)}
.ban .line{font-family:var(--font-display);font-size:clamp(24px,7.5vw,32px);line-height:1.15;text-wrap:balance;margin:2px 0 6px}
.ban .pen{display:inline-block;font-family:var(--font-display);font-size:20px;padding:2px 12px;border-radius:999px;background:var(--alarm);color:var(--paper)}
@keyframes pop{from{transform:translateX(-50%) rotate(-2deg) scale(.7);opacity:0}}
.hint{position:absolute;left:0;right:0;bottom:18px;margin:0;text-align:center;font-weight:700;font-size:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-shadow:0 2px 0 var(--ink);pointer-events:none}

.screen{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:14px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center;overflow-y:auto;background:linear-gradient(color-mix(in srgb,var(--ink) 30%,transparent),color-mix(in srgb,var(--ink) 90%,transparent) 48%)}
.sign{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:6px;background:var(--exit);color:var(--paper);font-weight:700;font-size:13px;letter-spacing:.08em;box-shadow:0 0 24px color-mix(in srgb,var(--exit) 60%,transparent)}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(60px,19vw,96px);line-height:.95;margin:0;letter-spacing:-.01em;text-shadow:0 5px 0 var(--ink)}
h1 em{font-style:normal;color:var(--exit)}
.lead{margin:0;max-width:30ch;color:var(--paper);text-wrap:balance}
.days{display:flex;gap:8px}
.day{width:50px;height:54px;border-radius:14px;border:2px solid color-mix(in srgb,var(--paper) 30%,transparent);background:var(--ink);font-family:var(--font-display);font-size:22px;cursor:pointer;display:grid;place-items:center;line-height:1}
.day small{display:block;font-family:var(--font-body);font-size:10px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.day[aria-checked="true"]{background:var(--exit);border-color:var(--exit);color:var(--ink)}
.day[aria-checked="true"] small{color:var(--ink)}
.day:disabled{opacity:.4;cursor:not-allowed}
.tip{margin:0;min-height:1.5em;color:var(--gold);font-weight:700}
.btn{font-family:var(--font-display);font-size:22px;padding:14px 30px;border-radius:16px;border:0;background:var(--exit);color:var(--ink);box-shadow:0 6px 0 var(--exit-deep);cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--exit-deep)}
.btn.ghost{background:var(--ink);color:var(--paper);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--paper) 35%,transparent);font-size:17px;padding:12px 18px}
.btn.ghost:active{box-shadow:inset 0 0 0 2px var(--paper)}
.how{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px;color:var(--muted);max-width:34ch}
.how b{color:var(--paper)}
.rtime{font-family:var(--font-display);font-size:clamp(64px,21vw,104px);line-height:.95;margin:0;font-variant-numeric:tabular-nums;text-shadow:0 5px 0 var(--ink)}
.rtime small{font-size:.36em;opacity:.7}
.rgrade{font-family:var(--font-display);font-size:28px;margin:0;color:var(--exit)}
.rgrade.fail{color:var(--alarm)}
.rlist{margin:0;font-size:13px;color:var(--muted);max-width:36ch;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#shareTxt{width:min(100%,340px);height:84px;border-radius:12px;border:2px solid var(--muted);background:var(--ink);color:var(--paper);font:13px/1.5 var(--font-body);padding:8px;-webkit-user-select:text;user-select:text}
@media (prefers-reduced-motion:reduce){.ban{animation:none}}
</style>
</head>
<body>

<div id="stage">
  <canvas id="cv" aria-label="퇴근 러시 게임 화면"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hud-row">
      <div class="tag" id="hDay">월요일</div>
      <div class="clock" id="hClock">17:59<small>:00</small></div>
      <div class="hud-btns">
        <button class="ic" id="bSnd" type="button" aria-label="소리 끄기">♪</button>
        <button class="ic" id="bPause" type="button" aria-label="일시정지">Ⅱ</button>
      </div>
    </div>
    <div class="prog"><span id="hFloor">12F</span><div class="bar"><i id="hBar"></i></div><span class="out">퇴근</span></div>
    <div class="chips" id="hChips"></div>
  </div>

  <div class="ban" id="ban" hidden role="status">
    <div class="who" id="banWho"></div>
    <div class="line" id="banLine"></div>
    <div class="pen" id="banPen"></div>
  </div>
  <p class="hint" id="hint" hidden></p>

  <section class="screen" id="menu">
    <div class="sign">EXIT · 17:59</div>
    <h1>퇴근 <em>러시</em></h1>
    <p class="lead">6시 정각에 건물을 빠져나가세요. 붙잡히면 퇴근이 늦어지고, 21시를 넘기면 야근입니다.</p>
    <div class="days" id="days" role="radiogroup" aria-label="요일 선택"></div>
    <p class="tip" id="dayTip"></p>
    <button class="btn" id="bStart" type="button">퇴근하기</button>
    <ul class="how">
      <li id="howCtl"></li>
      <li><b>말 거는 사람</b>은 옆줄로 피하고, <b>상자와 청소 띠</b>는 뛰어넘으세요.</li>
      <li><b>이어폰·연차·드링크</b>는 줍고, <b>법카</b>는 건드리지 마세요.</li>
    </ul>
  </section>

  <section class="screen" id="res" hidden>
    <div class="sign" id="rDay">월요일</div>
    <p class="rtime" id="rTime">18:00</p>
    <p class="rgrade" id="rGrade"></p>
    <p class="lead" id="rMsg"></p>
    <p class="rlist" id="rList"></p>
    <div class="row">
      <button class="btn" id="bNext" type="button">다음 요일</button>
      <button class="btn ghost" id="bRetry" type="button">다시 도전</button>
      <button class="btn ghost" id="bCopy" type="button">결과 복사</button>
      <button class="btn ghost" id="bMenu" type="button">요일 선택</button>
    </div>
    <textarea id="shareTxt" readonly hidden aria-label="공유용 결과"></textarea>
  </section>

  <section class="screen" id="pause" hidden>
    <p class="rgrade">잠깐 멈춤</p>
    <p class="lead">시계도 같이 멈췄습니다.</p>
    <div class="row">
      <button class="btn" id="bResume" type="button">계속 달리기</button>
      <button class="btn ghost" id="bQuit" type="button">요일 선택</button>
    </div>
  </section>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FB='"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif',FD='"Black Han Sans",'+FB;
const C={ink:'#141a2e',exit:'#19c37d',exitD:'#0c8f58',dusk:'#ff8a4c',alarm:'#ff5a5f',gold:'#f4c95d',paper:'#f6f1e7'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.floor(Math.random()*a.length)],ease=k=>k*k*(3-2*k);
if(!ctx.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()};

/* ---------- 등장인물과 요일 ---------- */
/* line: 다가오며 하는 말 · got: 붙잡은 뒤 본색 · hs: 머리 모양 · pose: 손에 든 것과 자세 · face: 눈·눈썹·입 */
const FOES={
  jam:{name:'잠깐맨',line:'잠깐 시간 돼?',got:'금방 끝나. 한 시간이면 돼.',pen:10,side:1,shirt:'#eef2fb',hair:'#17151d',hs:'slick',pose:'halt',tie:'loose',tieC:'#3b4a78',tilt:.05,face:{eye:'hood',brow:.25,raise:1,mouth:'smirk'}},
  cof:{name:'커피 선배',line:'커피 한잔 할래?',got:'아메리카노는 네가 사는 거지?',pen:15,shirt:'#c9b8e8',hair:'#6b3f2a',hs:'wave',pose:'cups',face:{eye:'arc',brow:-.15,mouth:'grin'}},
  urg:{name:'안급해 대리',line:'이거 급한 건 아닌데…',got:'급한 건 아닌데, 오늘 안에만.',pen:20,bw:.44,shirt:'#9fd0c4',hair:'#1f1c26',hs:'bowl',pose:'stack',face:{eye:'lens',brow:.1,mouth:'flat'}},
  chk:{name:'확인만 사원',line:'퇴근 전에 확인만요!',got:'서른 장인데 금방 보시죠?',pen:15,side:1,shirt:'#f6d77a',hair:'#3b2a22',hs:'pony',pose:'tablet',tempo:7,face:{eye:'wide',brow:-.3,mouth:'grin'}},
  car:{name:'다정한 선배',line:'요즘 힘들지?',got:'이거 먹고 힘내. 연차는 내가 챙겨줄게.',pen:5,gift:1,kind:1,shirt:'#f6b7a6',hair:'#4a3328',hs:'bob',pose:'wave',cardigan:1,face:{eye:'arc',brow:-.2,mouth:'smile'}},
  nun:{name:'눈치 차장',line:'벌써 가게?',got:'다들 아직 있는데?',pen:20,bw:.52,shirt:'#8e3b52',hair:'#1f1c26',skin:'#eec09a',hs:'crop',pose:'crossed',tap:1,tilt:-.05,shade:1,bub:'ink',face:{eye:'hood',lid:.16,brow:.45,browW:.13,raise:1,mouth:'frown'}},
  lat:{name:'라떼 부장',line:'나 때는 말이야~',got:'요즘 애들은 6시면 가더라?',pen:30,wide:1,bw:.74,belly:1,shirt:'#7c88ad',sleeve:'#e9e4d8',suit:1,tie:1,hair:'#9a9aa6',skin:'#e8b48f',hs:'combover',pose:'lecture',jowl:1,shade:1,face:{eye:'hood',brow:.7,browW:.17,mouth:'frown'}},
  hoe:{name:'회식 전도사',line:'오늘 한잔? 딱 한잔만!',got:'2차는 노래방이야!',pen:25,wide:1,bw:.6,shirt:'#f08a6b',hair:'#2a2330',hs:'tieband',pose:'cheers',flush:1,swayA:.07,tempo:3,face:{eye:'arc',brow:.1,mouth:'grin'}},
  tod:{name:'오늘까지 과장',line:'오늘까지 되죠?',got:'퇴근은 이거 끝내고요.',pen:40,dday:1,bw:.48,shirt:'#454b6e',pants:'#22263d',suit:1,tie:1,hair:'#17151d',hs:'part',pose:'stamp',shade:1,bub:'ink',face:{eye:'hood',lid:.17,brow:.8,browW:.09,mouth:'flat',specs:1}},
  boss:{name:'아 맞다 팀장',line:'아 맞다!',got:'하나만 더. 한 열 개쯤?',pen:60,wide:1,boss:1,size:1.16,bw:.66,shirt:'#2c3a78',pants:'#161b33',suit:1,tie:1,hair:'#17151d',skin:'#eec09a',hs:'pomp',pose:'grab',shade:1,bub:'red',face:{eye:'hood',brow:1,browW:.17,mouth:'shout',red:1}},
  card:{name:'법인카드',line:'법카를 주웠다…',got:'법카를 주웠다… 팀 회식 확정',pen:45}
};
const DAYS=[
  {k:'월',name:'월요일',speed:14.5,gap:18,two:.1,boss:1,pool:['jam','cof','urg','car'],tip:'다들 기운이 없어서 느립니다.'},
  {k:'화',name:'화요일',speed:16,gap:16.5,two:.2,boss:1,pool:['jam','cof','urg','car','nun','lat'],tip:'라떼 부장이 복도에 나왔습니다.'},
  {k:'수',name:'수요일',speed:17.5,gap:15,two:.3,boss:2,pool:['jam','cof','urg','nun','lat','hoe','chk','car'],tip:'회식 전도사가 돌아다닙니다.'},
  {k:'목',name:'목요일',speed:19,gap:14,two:.38,boss:2,pool:['jam','cof','urg','chk','nun','lat','hoe','tod','car'],tip:'"오늘까지 되죠?"를 조심하세요.'},
  {k:'금',name:'금요일',speed:21,gap:13,two:.45,boss:3,pool:['jam','cof','urg','chk','nun','lat','hoe','tod','tod'],tip:'모두가 당신을 찾고 있습니다.'}
];
const T_START=17*3600+59*60,T_SIX=18*3600,T_LIMIT=21*3600;

/* ---------- 저장 (기기별 기록) ---------- */
let save={u:0,b:[0,0,0,0,0]};
try{const s=JSON.parse(localStorage.getItem('toegeun-rush')||'null');if(s&&Array.isArray(s.b))save=s}catch(e){}
const persist=()=>{try{localStorage.setItem('toegeun-rush',JSON.stringify(save))}catch(e){}};

/* ---------- 소리 ---------- */
let AC=null,muted=false;
function tone(f,d,type,v,slide,delay){
  if(muted)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'triangle';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const sfx={
  lane:()=>tone(520,.07,'triangle',.04,220),
  jump:()=>tone(300,.2,'triangle',.05,420),
  hit:()=>{tone(170,.32,'sawtooth',.07,-110);tone(90,.3,'square',.05,-40,.05)},
  bump:()=>tone(140,.16,'square',.05,-60),
  item:()=>{tone(880,.09,'triangle',.05);tone(1320,.14,'triangle',.05,0,.08)},
  dodge:()=>tone(700,.1,'sine',.04,300),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.06,0,i*.11)),
  fail:()=>[392,330,262,196].forEach((f,i)=>tone(f,.3,'sawtooth',.05,0,i*.16))
};

/* ---------- 화면과 투영 ---------- */
let W=0,H=0,U=0,base=0,hor=0,cx=0,SKY=[];
const D=7;
const sc=z=>D/(D+z);
const PX=(x,z)=>cx+x*U*sc(z);
const PY=(h,z)=>{const s=sc(z);return hor+(base-hor)*s-h*U*s};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function resize(){
  const r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(200,r.width);H=Math.max(300,r.height);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  U=Math.min(W*.26,H*.17);base=H*.84;hor=H*.3;cx=W/2;
  const R=rng(7);SKY=[];
  for(let layer=0;layer<2;layer++){
    let x=-10;
    while(x<W+10){
      const w=W*(.05+R()*.08),h=H*(layer?.03+R()*.07:.05+R()*.11),win=[];
      for(let i=0;i<5;i++)if(R()<.6)win.push([R()*.7+.1,R()*.75+.08]);
      SKY.push({x,w,h,c:layer?'#2a2148':'#4a2f5e',win});x+=w+W*R()*.02;
    }
  }
}

/* ---------- 상태 ---------- */
const S={mode:'menu',day:0,t:0,dist:0,speed:0,run:0,pen:0,lane:0,px:0,jump:0,vy:0,L:1,T0:45,ents:[],floats:[],caught:{},shake:0,
  fx:{ear:0,drink:0,dday:0,inv:0,slow:0,stun:0,shield:false}};
const clock=()=>T_START+S.run*(60/S.T0)+S.pen*60;
const pad=n=>String(n).padStart(2,'0');
const hm=c=>pad(Math.floor(c/3600))+':'+pad(Math.floor(c%3600/60));
const ss=c=>':'+pad(Math.floor(c%60));

function foe(ty,d,x,line){
  const f=FOES[ty],e={kind:'foe',ty,d,x,lane:x,ph:Math.random()*6,line:line||f.line};
  if(f.side&&!f.wide){e.side=x===0?pick([-1,1]):Math.sign(x);e.x=e.side*2.3}
  return e;
}
function build(day){
  const dy=DAYS[day],L=dy.speed*46,ents=[],bossStart=L-26-dy.boss*16;
  let d=50;
  while(d<bossStart-12){
    const r=Math.random();
    if(r<.1)ents.push({kind:'low',sub:'tape',d,need:.3});
    else if(r<.22){const a=[-1,0,1].sort(()=>Math.random()-.5).slice(0,Math.random()<.5?1:2);ents.push({kind:'low',sub:'box',d,lanes:a,need:.5})}
    else if(r<.29)ents.push({kind:'low',sub:'chair',d,x:0,ph:Math.random()*6,need:.75});
    else{
      const ty=pick(dy.pool),f=FOES[ty];
      if(f.wide)ents.push(foe(ty,d,Math.random()<.5?-.5:.5));
      else{
        const ln=pick([-1,0,1]);ents.push(foe(ty,d,ln));
        if(Math.random()<dy.two){
          const o=pick([-1,0,1].filter(v=>v!==ln)),t2=pick(dy.pool.filter(k=>!FOES[k].wide));
          ents.push(foe(t2,d+1+Math.random()*2,o));
        }
      }
    }
    if(Math.random()<.22){
      const r2=Math.random(),sub=r2<.27?'ear':r2<.55?'drink':r2<.76?'leave':'card';
      ents.push({kind:'item',sub,d:d+dy.gap*.5,x:pick([-1,0,1]),ph:Math.random()*6});
    }
    d+=dy.gap*(.85+Math.random()*.4);
  }
  const lines=['아 맞다!','아, 그리고!','진짜 마지막!'];let side=pick([-.5,.5]);
  for(let i=0;i<dy.boss;i++){ents.push(foe('boss',bossStart+i*16,side,lines[i]));if(Math.random()<.7)side=-side}
  for(let k=1;k<12;k++)ents.push({kind:'gate',d:L*k/12,label:(12-k)+'F'});
  ents.push({kind:'exit',d:L});
  ents.sort((a,b)=>a.d-b.d);
  return{L,ents};
}

function start(day){
  const b=build(day),dy=DAYS[day];
  Object.assign(S,{mode:'run',day,dist:0,speed:0,run:0,pen:0,lane:0,px:0,jump:0,vy:0,L:b.L,ents:b.ents,floats:[],caught:{},shake:0});
  S.T0=b.L/dy.speed*.944+.3;
  S.fx={ear:0,drink:0,dday:0,inv:0,slow:0,stun:0,shield:false};
  $('menu').hidden=$('res').hidden=$('pause').hidden=true;$('ban').hidden=true;$('hud').hidden=false;
  $('hDay').textContent=dy.name;
  const h=$('hint');h.textContent=coarse?'좌우 탭: 줄 바꾸기 · 위로 밀기: 점프':'← → 줄 바꾸기 · Space 점프';h.hidden=false;
  setTimeout(()=>{h.hidden=true},4200);
  lastChips='';lastClock='';
}

function float(tx,c){S.floats.push({tx,c:c||C.paper,x:cx+S.px*U,y:base-1.75*U,life:1.1})}
function banner(who,line,pen){
  $('banWho').textContent=who;$('banLine').textContent='"'+line+'"';$('banPen').textContent='+'+pen+'분';
  const b=$('ban');b.hidden=true;void b.offsetWidth;b.hidden=false;
}
function catchBy(e,ty){
  const f=FOES[ty],fx=S.fx;
  if(ty!=='card'){
    if(fx.inv>0)return;
    if(fx.ear>0){e.done=e.ghost=true;float('못 들은 척',C.exit);sfx.dodge();return}
    if(fx.shield){fx.shield=false;fx.inv=1;e.done=e.ghost=true;float('연차 사용!',C.gold);sfx.dodge();return}
  }
  e.done=true;S.pen+=f.pen;S.caught[ty]=(S.caught[ty]||0)+1;
  fx.stun=ty==='card'?1:1.2;fx.drink=0;S.shake=1;
  if(f.dday)fx.dday=7;
  if(f.gift)fx.shield=true;
  banner(f.name,f.got||e.line||f.line,f.pen);sfx.hit();
}
function update(dt){
  S.t+=dt;
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*3);
  for(const f of S.floats){f.life-=dt;f.y-=dt*46}
  S.floats=S.floats.filter(f=>f.life>0);
  if(S.mode==='menu'||S.mode==='over'){S.dist+=5*dt;S.px+=(0-S.px)*Math.min(1,dt*6);return}
  if(S.mode!=='run')return;
  const dy=DAYS[S.day],fx=S.fx;
  if(fx.stun>0){
    fx.stun-=dt;S.speed=0;
    if(fx.stun<=0){fx.stun=0;fx.inv=1.7;$('ban').hidden=true}
  }else{
    let tg=dy.speed*(1+.12*S.dist/S.L);
    if(fx.drink>0)tg*=1.4;if(fx.dday>0)tg*=.85;if(fx.slow>0)tg*=.5;
    S.speed+=(tg-S.speed)*Math.min(1,dt*5);S.run+=dt;
    for(const k of['ear','drink','dday','inv','slow'])if(fx[k]>0)fx[k]=Math.max(0,fx[k]-dt);
  }
  S.dist+=S.speed*dt;
  S.px+=(S.lane-S.px)*Math.min(1,dt*16);
  if(S.jump>0||S.vy>0){S.jump+=S.vy*dt;S.vy-=22*dt;if(S.jump<=0){S.jump=0;S.vy=0}}
  for(const e of S.ents){
    const z=e.d-S.dist;
    if(e.side&&e.kind==='foe'){const k=ease(clamp((40-z)/16,0,1)),sx=e.side*2.3;e.x=sx+(e.lane-sx)*k}
    if(e.sub==='chair')e.x=Math.sin(S.t*1.5+e.ph)*1.05;
    if(e.kind==='exit'){if(z<=.4){finish(true);return}continue}
    if(e.done||fx.stun>0||z>.9||z<-.7||e.kind==='gate')continue;
    if(e.kind==='foe'){
      if(Math.abs(S.px-e.x)<(FOES[e.ty].wide?1.02:.58))catchBy(e,e.ty);
    }else if(e.kind==='low'){
      const inLane=e.sub==='tape'||(e.sub==='chair'?Math.abs(S.px-e.x)<.6:e.lanes.some(l=>Math.abs(S.px-l)<.55));
      if(!inLane)continue;
      e.done=true;
      if(S.jump<e.need&&fx.inv<=0){S.pen+=2;fx.slow=.9;S.shake=.6;float('+2분',C.alarm);sfx.bump()}
    }else if(e.kind==='item'&&Math.abs(S.px-e.x)<.6&&S.jump<1){
      e.done=e.got=true;
      if(e.sub==='card'){catchBy(e,'card');continue}
      sfx.item();
      if(e.sub==='ear'){fx.ear=6;float('이어폰 착용',C.exit)}
      if(e.sub==='drink'){fx.drink=3.5;float('가속!',C.gold)}
      if(e.sub==='leave'){fx.shield=true;float('연차 1장 확보',C.gold)}
    }
  }
  while(S.ents.length&&S.ents[0].d-S.dist<-3.5)S.ents.shift();
  if(clock()>=T_LIMIT)finish(false);
}
function grade(c,win){
  if(!win)return['야근 확정','21시가 넘었습니다. 저녁은 회사에서 드세요.'];
  if(c<T_SIX)return['칼퇴 그 이상','6시 전에 나갔습니다. 인사팀이 지켜보고 있어요.'];
  if(c<T_SIX+60)return['전설의 칼퇴','아무에게도 붙잡히지 않았습니다. 내일도 이렇게.'];
  if(c<T_SIX+30*60)return['칼퇴 성공','이 정도면 선방입니다. 저녁 약속에 늦지 않아요.'];
  if(c<T_SIX+90*60)return['눈치 퇴근','몇 번 붙잡혔지만 해 지기 전에 나왔습니다.'];
  return['막차 퇴근','가까스로 빠져나왔습니다. 편의점 도시락이 기다립니다.'];
}
let shareText='';
function finish(win){
  const c=clock(),dy=DAYS[S.day],[g,msg]=grade(c,win);
  S.mode='over';$('hud').hidden=true;$('ban').hidden=true;$('hint').hidden=true;
  win?sfx.win():sfx.fail();
  let best='';
  if(win){
    if(!save.b[S.day]||c<save.b[S.day]){save.b[S.day]=Math.round(c);best=' · 내 최고 기록'}
    save.u=Math.max(save.u,Math.min(4,S.day+1));persist();
  }
  const who=Object.entries(S.caught).map(([k,n])=>FOES[k].name+' ×'+n).join(' · ');
  $('rDay').textContent=dy.name+' 퇴근 기록';
  $('rTime').innerHTML=win?hm(c)+'<small>'+ss(c)+'</small>':'21:00';
  const rg=$('rGrade');rg.textContent=g;rg.classList.toggle('fail',!win);
  $('rMsg').textContent=msg;
  $('rList').textContent=(who?'붙잡힌 상대: '+who:'아무에게도 붙잡히지 않았습니다')+best;
  $('bNext').hidden=!(win&&S.day<4);
  if(!$('bNext').hidden)$('bNext').textContent=DAYS[S.day+1].name+' 도전';
  $('shareTxt').hidden=true;$('bCopy').textContent='결과 복사';
  shareText='퇴근 러시 · '+dy.name+'\n'+(win?hm(c)+' 퇴근':'21시 넘김')+' ('+g+')\n'+(who?'붙잡힌 상대: '+who:'아무에게도 안 붙잡힘');
  $('res').hidden=false;
  ($('bNext').hidden?$('bRetry'):$('bNext')).focus({preventScroll:true});
}

const ell=(x,y,rx,ry)=>{ctx.beginPath();ctx.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,6.2832);ctx.fill()};

function drawSides(){

      ctx.strokeStyle='rgba(20,26,46,.45)';ctx.lineWidth=Math.max(1,2*sc(z));ln(PX(x,z),PY(0,z),PX(x,z),PY(1.25,z));
    }

function bubble(x,y,text,k,style,m){

      const x=PX(e.x,z);
      ctx.fillStyle='rgba(8,10,28,.3)';ell(x,y,.34*u,.08*u);
      ctx.fillStyle='#11142a';ell(x,y-.04*u,.3*u,.06*u);ctx.fillRect(x-.03*u,y-.4*u,.06*u,.36*u);
      ctx.fillStyle='#5561a0';box(x-.27*u,y-.5*u,.54*u,.13*u,.05*u);box(x-.24*u,y-.98*u,.48*u,.46*u,.1*u);
    }
  }else if(e.kind==='item'&&!e.got){
    const x=PX(e.x,z),yy=y-(.62+(RM?0:Math.sin(S.t*4+e.ph)*.06))*u,r=.27*u,card=e.sub==='card';
    ctx.fillStyle='rgba(8,10,28,.3)';ell(x,y,.2*u,.05*u);
    ctx.fillStyle=card?'rgba(244,201,93,.3)':'rgba(25,195,125,.3)';circ(x,yy,r*1.45);
    ctx.fillStyle=card?C.gold:e.sub==='leave'?'#ffffff':C.exit;circ(x,yy,r);
    ctx.strokeStyle='#ffffff';ctx.lineWidth=Math.max(1,.04*u);ctx.beginPath();ctx.arc(x,yy,r,0,6.2832);ctx.stroke();
    if(e.sub==='ear'){ctx.lineWidth=Math.max(1,.05*u);ctx.beginPath();ctx.arc(x,yy+.02*u,.13*u,Math.PI,0);ctx.stroke();ctx.fillStyle='#ffffff';box(x-.18*u,yy,.09*u,.14*u,.03*u);box(x+.09*u,yy,.09*u,.14*u,.03*u)}
    else if(e.sub==='drink'){ctx.fillStyle='#ffffff';box(x-.09*u,yy-.16*u,.18*u,.32*u,.04*u);ctx.fillStyle=C.dusk;ctx.beginPath();ctx.moveTo(x+.03*u,yy-.1*u);ctx.lineTo(x-.05*u,yy+.02*u);ctx.lineTo(x,yy+.02*u);ctx.lineTo(x-.03*u,yy+.11*u);ctx.lineTo(x+.05*u,yy-.02*u);ctx.lineTo(x,yy-.02*u);ctx.closePath();ctx.fill()}
    else{ctx.fillStyle=card?C.ink:C.exitD;ctx.font=(.2*u)+'px '+FD;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(card?'법카':'연차',x,yy+.01*u)}
  }
  ctx.restore();
}
function render(){
  ctx.clearRect(0,0,W,H);ctx.save();
  if(S.shake>0&&!RM)ctx.translate((Math.random()-.5)*S.shake*12,(Math.random()-.5)*S.shake*8);
  drawSky();drawFloor();drawSides();
  let drew=false;
  if(S.mode==='run'||S.mode==='pause'){
    for(let i=S.ents.length-1;i>=0;i--){
      const e=S.ents[i],z=e.d-S.dist;
      if(!drew&&z<0){drawPlayer();drew=true}
      drawEnt(e,z);
    }
  }
  if(!drew)drawPlayer();
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const f of S.floats){ctx.globalAlpha=clamp(f.life*2,0,1);ctx.font='22px '+FD;ctx.lineWidth=5;ctx.strokeStyle=C.ink;ctx.lineJoin='round';ctx.strokeText(f.tx,clamp(f.x,70,W-70),f.y);ctx.fillStyle=f.c;ctx.fillText(f.tx,clamp(f.x,70,W-70),f.y)}
  ctx.globalAlpha=1;ctx.restore();
}

/* ---------- HUD ---------- */
let lastChips='',lastClock='';
function hud(){
  if(S.mode!=='run')return;
  const c=clock(),txt=hm(c)+ss(c);
  if(txt!==lastClock){
    lastClock=txt;const el=$('hClock');
    el.innerHTML=hm(c)+'<small>'+ss(c)+'</small>';
    el.classList.toggle('late',c>=T_SIX+60&&c<T_LIMIT-3600);el.classList.toggle('danger',c>=T_LIMIT-3600);
  }
  const p=clamp(S.dist/S.L,0,1),fl=Math.max(1,12-Math.floor(p*12));
  $('hBar').style.width=(p*100).toFixed(1)+'%';$('hFloor').textContent=fl===1?'로비':fl+'F';
  const fx=S.fx,ch=[];
  if(fx.ear>0)ch.push(['','이어폰 '+Math.ceil(fx.ear)+'초']);
  if(fx.drink>0)ch.push(['gold','가속']);
  if(fx.shield)ch.push(['gold','연차 1장']);
  if(fx.dday>0)ch.push(['bad','D-DAY 감속']);
  const key=ch.join('|');
  if(key!==lastChips){lastChips=key;$('hChips').innerHTML=ch.map(c=>'<span class="chip '+c[0]+'">'+c[1]+'</span>').join('')}
}

/* ---------- 조작 ---------- */
const coarse=matchMedia('(pointer: coarse)').matches;
function move(d){if(S.mode!=='run'||S.fx.stun>0)return;const n=clamp(S.lane+d,-1,1);if(n!==S.lane){S.lane=n;sfx.lane()}}
function jump(){if(S.mode!=='run'||S.fx.stun>0||S.jump>0)return;S.vy=7.2;S.jump=.001;sfx.jump()}
let ptr=null;
cv.addEventListener('pointerdown',e=>{if(S.mode!=='run')return;ptr={x:e.clientX,y:e.clientY,used:false};e.preventDefault()});
cv.addEventListener('pointermove',e=>{
  if(!ptr||ptr.used)return;
  const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;
  if(Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy)){ptr.used=true;move(Math.sign(dx))}
  else if(dy<-28){ptr.used=true;jump()}
});
cv.addEventListener('pointerup',e=>{
  if(!ptr)return;
  if(!ptr.used){const r=cv.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width;fx<.38?move(-1):fx>.62?move(1):jump()}
  ptr=null;
});
cv.addEventListener('pointercancel',()=>{ptr=null});
addEventListener('keydown',e=>{
  const k=e.key;
  if(S.mode==='run'){
    if(k==='ArrowLeft'||k==='a'||k==='A'){move(-1);e.preventDefault()}
    else if(k==='ArrowRight'||k==='d'||k==='D'){move(1);e.preventDefault()}
    else if(k==='ArrowUp'||k===' '||k==='w'||k==='W'){jump();e.preventDefault()}
    else if(k==='Escape'||k==='p'||k==='P')pause();
  }else if(S.mode==='pause'&&(k==='Escape'||k==='p'||k==='P'))resume();
});
function pause(){if(S.mode!=='run')return;S.mode='pause';$('pause').hidden=false;$('bResume').focus({preventScroll:true})}
function resume(){if(S.mode!=='pause')return;S.mode='run';$('pause').hidden=true;last=performance.now()}
function toMenu(){S.mode='menu';S.ents=[];S.lane=0;S.jump=0;S.fx.stun=0;S.fx.inv=0;S.fx.shield=false;S.fx.ear=0;S.fx.dday=0;$('hud').hidden=$('res').hidden=$('pause').hidden=$('ban').hidden=true;$('menu').hidden=false;drawDays()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

/* ---------- 메뉴 ---------- */
let sel=Math.min(save.u,4);
function drawDays(){
  const box=$('days');box.innerHTML='';
  DAYS.forEach((d,i)=>{
    const b=document.createElement('button');b.type='button';b.className='day';b.id='day'+i;
    b.setAttribute('role','radio');b.setAttribute('aria-checked',i===sel?'true':'false');
    b.setAttribute('aria-label',d.name+(i>save.u?' (잠김)':''));
    b.disabled=i>save.u;
    b.innerHTML='<span>'+d.k+'<small>'+(save.b[i]?hm(save.b[i]):i>save.u?'잠김':'-')+'</small></span>';
    b.addEventListener('click',()=>{sel=i;drawDays()});
    box.appendChild(b);
  });
  $('dayTip').textContent=DAYS[sel].name+' · '+DAYS[sel].tip;
}
$('howCtl').innerHTML=coarse?'<b>화면 좌우 탭</b>으로 줄을 바꾸고 <b>위로 밀어</b> 점프합니다.':'<b>← →</b>로 줄을 바꾸고 <b>Space</b>로 점프합니다.';
$('bStart').addEventListener('click',()=>start(sel));
$('bRetry').addEventListener('click',()=>start(S.day));
$('bNext').addEventListener('click',()=>{sel=Math.min(4,S.day+1);start(sel)});
$('bMenu').addEventListener('click',toMenu);
$('bQuit').addEventListener('click',toMenu);
$('bResume').addEventListener('click',resume);
$('bPause').addEventListener('click',pause);
$('bSnd').addEventListener('click',()=>{muted=!muted;const b=$('bSnd');b.textContent=muted?'×':'♪';b.setAttribute('aria-label',muted?'소리 켜기':'소리 끄기')});
$('bCopy').addEventListener('click',()=>{
  const done=()=>{$('bCopy').textContent='복사했어요'};
  const fallback=()=>{const t=$('shareTxt');t.value=shareText;t.hidden=false;t.focus();t.select();$('bCopy').textContent='아래 글을 복사하세요'};
  try{navigator.clipboard.writeText(shareText).then(done,fallback)}catch(e){fallback()}
});

/* ---------- 루프 ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);render();hud();
  requestAnimationFrame(loop);
}
addEventListener('resize',resize);
resize();drawDays();
if(document.fonts&&document.fonts.load){document.fonts.load('16px "Black Han Sans"');document.fonts.load('700 16px "IBM Plex Sans KR"')}
requestAnimationFrame(loop);
})();
</script>
